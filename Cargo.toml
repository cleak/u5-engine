[workspace]
resolver = "3"
members = [
    "crates/u5-runtime",
    "crates/u5-tui",
    "crates/u5-bevy",
    "crates/u5-gamedata",
    "crates/u5-host-desktop",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
u5-runtime = { path = "crates/u5-runtime" }
u5-bevy = { path = "crates/u5-bevy" }
u5-gamedata = { path = "crates/u5-gamedata" }
u5-host-desktop = { path = "crates/u5-host-desktop" }
bevy = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

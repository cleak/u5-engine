name: CI

on:
  push:
    # Branch pushes only; tag pushes are handled by release.yml.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # CI has no original game files. Asset-backed tests are behind the
  # `original-asset-tests` feature or skip themselves when U5_TEST_ASSET_DIR
  # is unset, so it is deliberately left unset here.

  # The toolchain every job installs. Keep it equal to `channel` in
  # rust-toolchain.toml and in release.yml; the format job fails if they
  # differ.
  RUST_TOOLCHAIN: "1.98.0"

# Actions are pinned by full commit SHA with the release in a comment;
# Dependabot (.github/dependabot.yml) proposes bumps as pull requests.
#
# The gates run in order format, warning lines, clippy, test, each job
# needing the one before, so the cheap failures come first.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the workflow toolchains match rust-toolchain.toml
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          for workflow in .github/workflows/ci.yml .github/workflows/release.yml; do
            pinned=$(sed -n 's/^  RUST_TOOLCHAIN: *"\(.*\)"/\1/p' "$workflow")
            if [[ -z "$channel" || "$pinned" != "$channel" ]]; then
              echo "::error file=$workflow::RUST_TOOLCHAIN is '$pinned' but rust-toolchain.toml's channel is '$channel'"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  warnings:
    name: Build warnings
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bevy build dependencies
        # The same packages as the test job; see the note there.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-warnings

      - name: Self-test the warning-line gate
        run: python3 -m unittest qa/tools/test_check_no_build_warnings.py

      - name: Self-test the paired harness's exports
        # The parity lock and the load-latency export, over synthetic
        # folders; nothing is launched.
        run: >-
          python3 -m unittest
          qa/tools/test_paired_suite_parity_lock.py
          qa/tools/test_paired_suite_load_latency.py

      - name: Self-test the toggle-matrix runner
        # Report parsing and the pass rules, over synthetic reports; nothing
        # is launched.
        run: python3 -m unittest qa/tools/test_toggle_matrix.py

      - name: Build with warnings denied, then scan for warning lines
        run: qa/tools/check_no_build_warnings.sh

  clippy:
    name: Clippy
    needs: warnings
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bevy build dependencies
        # The same packages as the test job; see the note there.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-clippy

      - name: Clippy (workspace)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (windowed build)
        run: cargo clippy --locked -p u5-tui --features visual --all-targets -- -D warnings

  test-linux:
    name: Test (Linux)
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bevy build dependencies
        # Bevy: ALSA (audio), udev (gamepads), X11 and Wayland (windowing).
        # The native folder picker (rfd with its default xdg-portal backend)
        # talks to the desktop portal over D-Bus in pure Rust and needs no
        # GTK headers. If rfd is ever switched to its `gtk3` feature, add
        # libgtk-3-dev here and in release.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release

      - name: Test workspace
        run: cargo test --release --workspace --locked

      - name: Build windowed binary
        run: cargo build --release --locked -p u5-tui --features visual --bins

  build-windows:
    name: Build (Windows)
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Match the release build: link the C runtime statically so players do
      # not need the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release

      - name: Build windowed binary
        run: cargo build --release --locked -p u5-tui --features visual --bins

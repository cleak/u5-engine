# The Rust toolchain every build of this workspace uses, locally and in CI.
#
# Pinned to an exact release so a new stable cannot change formatting, lints
# or codegen under us; bump it deliberately in its own commit. The CI and
# release workflows install the same version: keep `RUST_TOOLCHAIN` in
# .github/workflows/ci.yml and release.yml equal to `channel` here (the CI
# format job checks it).
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
